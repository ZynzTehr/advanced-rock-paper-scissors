<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- displays site properly based on user's device -->
    <title> Rock, Paper, Scissors, Spock </title>
    <!-- <link rel="stylesheet" href="https://cdn.tlm.cloud/bootstrap/5.2.3/css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png">
  </head>

  <body>
    <!-- main container -->
    <div class="container d-flex flex-column justify-content-center align-items-center">
      <section class="row gameOptions justify-content-between w-75">
        <aside id="options" class="col-xs-2 col-sm-2 col-lg-4 options my-2">
          <h4>Rock</h4>
          <h4>Paper</h4>
          <h4>Scissors</h4>
        </aside>
        <div class="col-xs-5 col-sm-5 col-lg-3 mt-3">
          <aside class="score text-center d-flex flex-column mb-3">
            <span>Score</span>
            <span id="win" class="display-2 scores mt-4"></span>
          </aside>
        </div> <!-- col -->
      </section>
      <section class="row justify-content-center mt-5">
        <div class="col gameButtons">
          <button id="scissors" class="scissors circleBtn"></button>
          <button id="paper" class="paper circleBtn"></button>
          <button id="rock" class="rock circleBtn"></button>
          <div class="gameBtnsBackground"></div> <!-- for pentagon image -->
        </div> <!-- col -->
      </section>
      <section>
        <!-- Button trigger modal -->
        <button type="button" class="rules" data-bs-toggle="modal" data-bs-target="#rulesModal">
          rules
        </button>
        <!-- Modal -->
        <div class="modal fade" id="rulesModal" tabindex="-1" aria-labelledby="rpsls" aria-hidden="true">
          <div class="modal-dialog">
            <div class="modal-content text-center">
              <div class="modal-header">
                <h5 class="modal-title ms-4 modalText" id="rpsls">rules</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <img src="./assets/images/image-rules.svg">
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="row gamePlay  mx-auto my-5 justify-content-between">
        <aside class="col-3 d-flex flex-column justify-content-center align-items-center">
          <h4 class="youPick hide text-center">You Picked</h4>
          <figure class="mt-4 position-relative">
            <button class="you-scissors hide mediaQueryBtn"></button>
            <button class="you-paper hide mediaQueryBtn"></button>
            <button class="you-rock hide mediaQueryBtn"></button>
          </figure>
        </aside>
        <section class="col-5 outcome d-flex flex-column">
          <h4 id="you-win" class="hide text-center">You Win</h4>
          <h4 id="you-lost" class="hide text-center">You Lose</h4>
          <h4 id="you-tie" class="hide text-center">Tie</h4>
          <button id="playAgain" class="playAgain hide">Play Again</button>
        </section>
        <aside class="col-3 d-flex flex-column align-items-center">
          <h4 class="enemyPick hide text-center">House Picked</h4>
          <figure class="mt-4 position-relative">
            <button class="enemy-scissors hide mediaQueryBtn"></button>
            <button class="enemy-paper hide mediaQueryBtn"></button>
            <button class="enemy-rock hide mediaQueryBtn"></button>
          </figure>
        </aside>
      </section>
    </div> <!-- container -->

    <footer class="developer-footer text-center mt-4 mb-2">
      <small>Developed by <strong>Jorge Bucio</strong> &copy; 2025</small>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
    <script src="./js/main.js"></script>
  </body>

</html>
